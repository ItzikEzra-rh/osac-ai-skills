---
name: Skill Version Check

# paths filter is safe here: the check only inspects skills/*/SKILL.md
# files, so the filter scope matches the check scope exactly and cannot
# drift out of sync the way a broader job's filter could.
'on':
  pull_request:
    paths:
      - 'skills/**'

permissions:
  contents: read

concurrency:
  group: skill-version-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-skill-version:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check skill version bumps
        # fetch-depth: 0 already fetched origin/<base>. Avoid a second fetch
        # after checkout removes credentials: this repository is private.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash tools/check-skill-version-bump.sh "origin/${BASE_REF}"
